services:
  api:
    build: ./backend
    ports:
      - "8000:8000"
    environment:
      SERVE_FRONTEND: "0"
      DATA_DIR: /srv/data
    volumes:
      - ./data:/srv/data:ro
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')",
        ]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s
  web:
    build: ./frontend
    ports:
      - "80:80"
    depends_on:
      api:
        condition: service_healthy
